<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Wantit</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 320px;
        padding: 16px;
        background: #0a0a0a;
        color: #f5f5f5;
        font: 13px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; margin-bottom: 14px; }
      .mark {
        width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
        background: linear-gradient(135deg, #8b5cf6, #d946ef, #fb923c);
      }
      .card { border: 1px solid #1a1a1a; border-radius: 12px; overflow: hidden; background: #0f0f0f; }
      .img { aspect-ratio: 4 / 3; background: #111 center / cover no-repeat; }
      .meta { padding: 10px 12px; }
      .title { font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .site { color: #8a8a8a; font-size: 11px; margin-top: 4px; }
      button {
        width: 100%; margin-top: 12px; height: 38px; border: 0; border-radius: 10px;
        background: #fafafa; color: #0a0a0a; font: inherit; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #e5e5e5; }
      details { margin-top: 12px; color: #8a8a8a; font-size: 11px; }
      summary { cursor: pointer; }
      input {
        width: 100%; margin-top: 6px; height: 30px; padding: 0 8px; border-radius: 8px;
        border: 1px solid #262626; background: transparent; color: #f5f5f5; font: inherit;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <span class="mark">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="white"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
      </span>
      Wantit
    </div>

    <div class="card">
      <div class="img" id="img"></div>
      <div class="meta">
        <div class="title" id="title">…</div>
        <div class="site" id="site"></div>
      </div>
    </div>

    <button id="save">Salva nella wishlist</button>

    <details>
      <summary>Impostazioni</summary>
      <label>
        Indirizzo dell'app Wantit
        <input id="appUrl" placeholder="http://localhost:3000" />
      </label>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
